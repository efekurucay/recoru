<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recoru</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <span class="header-icon">🎸</span>
      <span class="header-title">Recoru</span>
    </header>

    <!-- Song Info -->
    <section class="song-section" id="song-section">
      <div id="no-song" class="no-song hidden">
        <span class="no-song-icon">🎵</span>
        <p>Bir akor sayfası açın</p>
        <small>hakoru.com veya repertuarim.com</small>
      </div>
      <div id="song-info" class="song-info hidden">
        <div class="song-site" id="song-site"></div>
        <div class="song-title" id="song-title"></div>
      </div>
    </section>

    <!-- Recordings List -->
    <section class="recordings-section" id="recordings-section">
      <div class="recordings-header">
        <span class="recordings-count" id="recordings-count">Kayıtlar</span>
      </div>
      <div id="no-recordings" class="no-recordings hidden">
        <span>Henüz kayıt yok</span>
        <small>Aşağıdan ilk kaydını başlat</small>
      </div>
      <ul class="recordings-list" id="recordings-list"></ul>
    </section>

    <!-- Record Controls -->
    <section class="record-section" id="record-section">
      <input
        type="text"
        id="record-label"
        class="label-input"
        placeholder="Kaydın adı... ör: 1. Deneme"
        maxlength="60"
      />
      <div class="record-buttons">
        <button id="btn-start" class="btn-record">
          <span class="rec-dot"></span> Kayıt Başlat
        </button>
        <button id="btn-stop" class="btn-stop hidden">
          <span class="recording-indicator">●</span> Durdur
        </button>
      </div>
      <div id="error-msg" class="error-msg hidden"></div>
    </section>
  </div>

  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
